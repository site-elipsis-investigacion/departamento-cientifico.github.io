<!doctype html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departamento Científico — Fundación SCP</title>
  <meta name="description" content="Archivo clasificado del Departamento Científico de la Fundación. Acceso restringido a personal autorizado." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307090c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d4a02a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d4a02a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style type="text/tailwindcss">
    @layer base {
      :root {
        --bg-void: #07090c;
        --bg-panel: #0c1117;
        --bg-elevated: #111a23;
        --border-faint: #1a2532;
        --border-strong: #2a3b4d;
        --accent-amber: #d4a02a;
        --accent-rust: #9a4a2a;
        --text-primary: #c8d2dc;
        --text-secondary: #8a98a8;
        --text-muted: #5a6878;
      }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: 'IBM Plex Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::selection { background: rgba(212, 160, 42, 0.3); color: #fff; }
    }

    @layer components {
      .font-typewriter { font-family: 'Special Elite', monospace; }
      .font-mono-ibm { font-family: 'IBM Plex Mono', monospace; }
      .panel {
        background: var(--bg-void);
        border: 1px solid var(--border-faint);
      }
    }

    @layer utilities {
      .text-glow-amber { text-shadow: none; }
      .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
      .animate-fade-in { animation: fade-in 0.8s ease-out forwards; }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #07090c; }
    ::-webkit-scrollbar-thumb { background: #1a2532; border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: #2a3b4d; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
  (function () {
    'use strict';

    /* ───────────── Iconos ───────────── */
    var SHIELD = '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>';
    var FILE = '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>';
    var ICONS = {
      lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
      alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      scroll: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
      building: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
      network: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
      home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
      microscope: '<path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/>',
      flask: '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
      dna: '<path d="m10 16 1.5 1.5"/><path d="m14 8-1.5-1.5"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/><path d="m16.5 10.5 1 1"/><path d="m17 6-2.891-2.891"/><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="m20 9 .891.891"/><path d="M3.109 14.109 4 15"/><path d="m6.5 12.5 1 1"/><path d="m7 18 2.891 2.891"/><path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/>',
      beaker: '<path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/>',
      shieldAlert: SHIELD + '<path d="M12 8v4"/><path d="M12 16h.01"/>',
      shieldCheck: SHIELD + '<path d="m9 12 2 2 4-4"/>',
      eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
      ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
      fileWarning: FILE + '<path d="M12 9v4"/><path d="M12 17h.01"/>',
      fileText: FILE + '<path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',
      star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
      clipboard: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
      archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
      image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
      radio: '<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/>',
      infinity: '<path d="M6 16c5 0 7-8 12-8a4 4 0 0 1 0 8c-5 0-7-8-12-8a4 4 0 1 0 0 8"/>',
      calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>'
    };

    function icon(name, size, cls) {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
        '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
        'stroke-linejoin="round" class="' + (cls || '') + '" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
    }

    /* ───────────── Emblema  ───────────── */
    function atomMark(cls) {
      return '<svg viewBox="0 0 200 200" class="' + cls + '" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<g><ellipse cx="100" cy="100" rx="85" ry="32" stroke="#d4a02a" stroke-width="1" opacity="0.5"/>' +
          '<circle cx="185" cy="100" r="4" fill="#d4a02a"/></g>' +
        '<g transform="rotate(60 100 100)"><ellipse cx="100" cy="100" rx="85" ry="32" stroke="#d4a02a" stroke-width="1" opacity="0.4"/>' +
          '<circle cx="20" cy="89" r="3" fill="#e8c558" opacity="0.8"/></g>' +
        '<g transform="rotate(120 100 100)"><ellipse cx="100" cy="100" rx="85" ry="32" stroke="#d4a02a" stroke-width="1" opacity="0.35"/>' +
          '<circle cx="71" cy="130" r="3.5" fill="#c8d2dc" opacity="0.7"/></g>' +
        '<circle cx="100" cy="100" r="14" fill="#9a4a2a" opacity="0.3"/>' +
        '<circle cx="100" cy="100" r="7" fill="#d4a02a"/>' +
        '<circle cx="100" cy="100" r="3" fill="#f0e6d0"/>' +
      '</svg>';
    }

    /* ───────────── Estado ───────────── */
    var state = { granted: false, authenticating: false, view: 'overview' };
    var app = document.getElementById('app');

    var NAV_ITEMS = [
      { id: 'introduccion', label: 'Introducción', icon: 'book' },
      { id: 'normas', label: 'Normas', icon: 'scroll' },
      { id: 'pruebas', label: 'Pruebas', icon: 'flask' },
      { id: 'administrativa', label: 'Administrativa', icon: 'building' },
      { id: 'jerarquia', label: 'Jerarquía', icon: 'network' }
    ];

    /* ───────────── Pantalla de acceso ───────────── */
    var BOOT = [
      'INGRESANDO A TERMINAL...',
      '> VERIFICANDO CREDENCIALES CON SERVIDOR CENTRAL...',
      '> NIVEL DE AUTORIZACIÓN: APROBADO',
      '> DESENCRIPTANDO ARCHIVO DEL DEPARTAMENTO CIENTÍFICO...',
      '> ACCESO CONCEDIDO. BIENVENIDO, INVESTIGADOR.'
    ];

    function accessScreen() {
      var inner;
      if (!state.authenticating) {
        inner =
          '<form id="access-form" class="panel rounded-sm p-6 space-y-5">' +
            '<div class="flex items-center gap-2 text-[#d4a02a] border-b border-[#1a2532] pb-3 mb-2">' +
              icon('lock', 14) +
              '<span class="font-mono-ibm text-xs tracking-[0.2em] uppercase">Autenticación Requerida</span>' +
            '</div>' +
            '<div>' +
              '<label class="font-mono-ibm text-[10px] text-[#5a6878] tracking-[0.2em] uppercase block mb-2">Identificador de Personal</label>' +
              '<input type="text" value="[DC] USUARIO DE INVESTIGACION" readonly class="w-full bg-[#07090c] border border-[#1a2532] text-[#5a6878] font-mono-ibm text-sm px-3 py-2.5 focus:outline-none cursor-default" />' +
            '</div>' +
            '<div>' +
              '<label class="font-mono-ibm text-[10px] text-[#5a6878] tracking-[0.2em] uppercase block mb-2">Nivel de Autorización</label>' +
              '<select class="w-full bg-[#07090c] border border-[#1a2532] text-[#c8d2dc] font-mono-ibm text-sm px-3 py-2.5 focus:border-[#d4a02a] focus:outline-none transition-colors">' +
                '<option>Nivel 1 — Confidencial</option>' +
                '<option>Nivel 2 — Restringido</option>' +
                '<option>Nivel 3 — Secreto</option>' +
              '</select>' +
            '</div>' +
            '<button type="button" data-action="access" class="w-full bg-[#9a4a2a]/20 border border-[#9a4a2a]/50 text-[#d4a02a] font-mono-ibm text-sm tracking-[0.2em] uppercase py-3 hover:bg-[#9a4a2a]/30 hover:border-[#9a4a2a] transition-all duration-300">Solicitar Acceso</button>' +
          '</form>';
      } else {
        inner =
          '<div class="panel rounded-sm p-6 font-mono-ibm text-xs">' +
            '<div class="flex items-center gap-2 text-[#d4a02a] border-b border-[#1a2532] pb-3 mb-4">' +
              icon('terminal', 14, 'animate-pulse') +
              '<span class="tracking-[0.2em] uppercase">Terminal — Conexión Segura</span>' +
            '</div>' +
            '<div id="log" class="space-y-1.5 min-h-[180px]">' +
              '<span id="cursor" class="inline-block w-2 h-4 bg-[#d4a02a] animate-pulse-glow align-middle"></span>' +
            '</div>' +
          '</div>';
      }

      return '' +
        '<div class="fixed inset-0 z-50 bg-[#07090c] flex items-center justify-center overflow-hidden">' +
          '' +
          '' +
          '<div class="relative w-full max-w-md px-6 animate-fade-in">' +
            '<div class="flex justify-center mb-8"><div class="relative">' +
              atomMark('w-48 h-48') +
              '' +
            '</div></div>' +
            '<div class="text-center mb-8">' +
              '<div class="flex items-center justify-center gap-2 text-[#9a4a2a] mb-3">' +
                icon('alert', 14) +
                '<span class="font-mono-ibm text-[10px] tracking-[0.3em] uppercase">Material Clasificado</span>' +
                icon('alert', 14) +
              '</div>' +
              '<h1 class="font-typewriter text-2xl text-[#c8d2dc] tracking-wide mb-2">DEPARTAMENTO CIENTÍFICO</h1>' +
              '<p class="font-mono-ibm text-xs text-[#5a6878] tracking-[0.2em] uppercase">Fundación SCP · División de Investigación</p>' +
            '</div>' +
            inner +
            '<div class="mt-6 flex items-center justify-center gap-4 text-[#3a4a5a] font-mono-ibm text-[9px] tracking-[0.2em] uppercase">' +
              '<span>SISTEMA v.1.0.1 INVESTIGACION</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function startAuthentication() {
      state.authenticating = true;
      render();
      var log = document.getElementById('log');
      var cursor = document.getElementById('cursor');
      BOOT.forEach(function (line, i) {
        setTimeout(function () {
          var div = document.createElement('div');
          var granted = line.indexOf('CONCEDIDO') !== -1 || line.indexOf('BIENVENIDO') !== -1;
          div.className = 'animate-fade-in ' + (granted ? 'text-[#d4a02a] text-glow-amber' : 'text-[#8a98a8]');
          div.textContent = line;
          log.insertBefore(div, cursor);
          if (i === BOOT.length - 1) {
            setTimeout(function () {
              state.granted = true;
              render();
            }, 900);
          }
        }, i * 420);
      });
    }

    /* ───────────── Cabecera ───────────── */
    function header() {
      var desktop = NAV_ITEMS.map(function (item) {
        var on = state.view === item.id;
        return '<button data-nav="' + item.id + '" class="flex items-center gap-2 px-3 py-2 font-mono-ibm text-[11px] tracking-[0.15em] uppercase transition-colors ' +
          (on ? 'text-[#d4a02a] border-b border-[#d4a02a]' : 'text-[#5a6878] hover:text-[#c8d2dc] border-b border-transparent') + '">' +
          icon(item.icon, 14) + item.label + '</button>';
      }).join('');

      var mobile = NAV_ITEMS.map(function (item) {
        var on = state.view === item.id;
        return '<button data-nav="' + item.id + '" class="flex items-center gap-1.5 px-2.5 py-1.5 font-mono-ibm text-[10px] tracking-[0.1em] uppercase whitespace-nowrap ' +
          (on ? 'text-[#d4a02a]' : 'text-[#5a6878]') + '">' + icon(item.icon, 12) + item.label + '</button>';
      }).join('');

      return '' +
        '<header class="sticky top-0 z-40 border-b border-[#1a2532] bg-[#07090c]/95 backdrop-blur-sm">' +
          '<div class="max-w-6xl mx-auto px-4 sm:px-6">' +
            '<div class="flex items-center justify-between h-16">' +
              '<button data-nav="overview" class="flex items-center gap-3 group">' +
                '<div class="relative w-10 h-10">' + atomMark('w-10 h-10') + '</div>' +
                '<div class="text-left">' +
                  '<div class="font-typewriter text-sm text-[#c8d2dc] tracking-wide leading-tight">Departamento Científico</div>' +
                  '<div class="font-mono-ibm text-[9px] text-[#5a6878] tracking-[0.2em] uppercase">Fundación SCP</div>' +
                '</div>' +
              '</button>' +
              '<nav class="hidden md:flex items-center gap-1">' +
                '<button data-nav="overview" class="flex items-center gap-2 px-3 py-2 font-mono-ibm text-[11px] tracking-[0.15em] uppercase text-[#5a6878] hover:text-[#d4a02a] transition-colors">' +
                  icon('home', 14) + 'Inicio</button>' + desktop +
              '</nav>' +
              '<div class="hidden sm:flex items-center gap-2 text-[#5a6878]">' +
                '<span class="w-2 h-2 bg-[#d4a02a] rounded-full animate-pulse-glow"></span>' +
                '<span class="font-mono-ibm text-[9px] tracking-[0.2em] uppercase">En Línea</span>' +
              '</div>' +
            '</div>' +
            '<nav class="md:hidden flex items-center gap-1 overflow-x-auto pb-2 -mt-1">' +
              '<button data-nav="overview" class="flex items-center gap-1.5 px-2.5 py-1.5 font-mono-ibm text-[10px] tracking-[0.1em] uppercase text-[#5a6878] hover:text-[#d4a02a] whitespace-nowrap">' +
                icon('home', 12) + 'Inicio</button>' + mobile +
            '</nav>' +
          '</div>' +
        '</header>';
    }

    /* ───────────── Helpers de sección ───────────── */
    function sectionHeading(index, title, subtitle) {
      return '<div class="mb-10">' +
        '<div class="flex items-center gap-3 mb-3">' +
          '<span class="font-mono-ibm text-[10px] text-[#9a4a2a] tracking-[0.3em] uppercase">' + index + '</span>' +
          '<div class="h-px flex-1 bg-[#1a2532]"></div>' +
        '</div>' +
        '<h2 class="font-typewriter text-3xl sm:text-4xl text-[#c8d2dc] tracking-wide">' + title + '</h2>' +
        '<p class="font-mono-ibm text-xs text-[#5a6878] tracking-[0.15em] uppercase mt-3">' + subtitle + '</p>' +
      '</div>';
    }
    function docBlock(children) {
      return '<div class="panel rounded-sm p-6 sm:p-8 leading-relaxed text-[#8a98a8]">' + children + '</div>';
    }

    /* ───────────── Inicio ───────────── */
    var CARDS = [
      { id: 'introduccion', title: 'Introducción', desc: 'Explicación y resumen de la estructura y las áreas de investigación del Departamento Científico.', icon: 'book' },
      { id: 'normas', title: 'Normas', desc: 'Código normativo que rige la conducta de todo el personal científico.', icon: 'scroll' },
      { id: 'administrativa', title: 'Administrativa', desc: 'Sección de información y vista de la organización de la jefatura del departamento.', icon: 'building' },
      { id: 'jerarquia', title: 'Jerarquía', desc: 'Muestra de la cadena de mando y rangos ordenados jerárquicamente.', icon: 'network' }
    ];

    function overview() {
      var cards = CARDS.map(function (c) {
        return '<button data-nav="' + c.id + '" class="panel rounded-sm p-6 text-left group hover:border-[#d4a02a]/40 transition-all duration-300">' +
          '<div class="flex items-start justify-between mb-4">' +
            '<div class="w-12 h-12 border border-[#1a2532] flex items-center justify-center text-[#d4a02a] group-hover:border-[#d4a02a]/40 group-hover:text-glow-amber transition-all">' + icon(c.icon, 20) + '</div>' +
            icon('arrow', 18, 'text-[#3a4a5a] group-hover:text-[#d4a02a] group-hover:translate-x-1 transition-all') +
          '</div>' +
          '<h3 class="font-typewriter text-xl text-[#c8d2dc] mb-2">' + c.title + '</h3>' +
          '<p class="text-sm text-[#8a98a8] leading-relaxed">' + c.desc + '</p>' +
          '<div class="mt-4 font-mono-ibm text-[10px] text-[#5a6878] tracking-[0.2em] uppercase">Acceder al documento »</div>' +
        '</button>';
      }).join('');

      return '<div class="animate-fade-in">' +
        '<section class="relative panel rounded-sm overflow-hidden mb-10">' +
          '' +
          '<div class="relative grid md:grid-cols-[1fr_auto] gap-8 p-8 sm:p-12 items-center">' +
            '<div>' +
              '<div class="flex items-center gap-2 text-[#9a4a2a] mb-5">' + icon('alert', 14) +
                '<span class="font-mono-ibm text-[10px] tracking-[0.3em] uppercase">Acceso Autorizado · Sesión Iniciada</span></div>' +
              '<h1 class="font-typewriter text-3xl sm:text-5xl text-[#c8d2dc] tracking-wide leading-tight mb-4">Departamento Científico</h1>' +
              '<p class="font-mono-ibm text-sm text-[#d4a02a] tracking-[0.2em] uppercase mb-6">Fundación SCP · División de Investigación</p>' +
              '<p class="text-[#8a98a8] leading-relaxed max-w-xl">ARCHIVO CLASIFICADO DEL BRAZO DE JUNTA DE INVESTIGACIÓN DE LA FUNDACIÓN. AQUÍ SE DOCUMENTA LA NORMATIVA, LA JERARQUÍA, LAS ESTRUCTURAS Y LAS BASES DEL ESTUDIO ANÓMALO.</p>' +
              '<p class="text-[#8a98a8] leading-relaxed max-w-xl">NAVEGUE CON CAUTELA.</p>' +
            '</div>' +
            '<div class="hidden md:flex justify-center"><div class="relative">' + atomMark('w-56 h-56') +
              '</div></div>' +
          '</div>' +
        '</section>' +
        '<div class="grid sm:grid-cols-2 gap-4 mb-12">' + cards + '</div>' +
        '<div class="panel rounded-sm p-6 sm:p-8">' +
          '<div class="flex items-center gap-2 text-[#d4a02a] mb-4"><span class="w-1.5 h-1.5 bg-[#d4a02a] rounded-full animate-pulse-glow"></span>' +
            '<span class="font-mono-ibm text-[10px] tracking-[0.3em] uppercase">Informe</span></div>' +
          '<p class="text-[#8a98a8] leading-relaxed mb-4">Una anomalía es todo objeto, entidad o fenómeno cuyas propiedades se desvían de las leyes naturales conocidas sin causa convencional que las explique. No es necesario que sea peligroso; basta con que resulte inexplicable bajo los modelos científicos actuales.</p>' +
          '<p class="text-[#5a6878] leading-relaxed text-sm">La labor del Departamento Científico consiste en comprender estas desviaciones a fondo antes de clasificarlas, para que cada decisión sobre su contención o uso se apoye en evidencia y no en conjetura.</p>' +
        '</div>' +
      '</div>';
    }

    /* ───────────── Introducción ───────────── */
    function introduccion() {
      return '<div class="animate-fade-in">' +
        sectionHeading('§ 01 — Documento SCD-001', 'Introducción', 'Propósito y alcance del Departamento Científico') +
        '<div class="relative panel rounded-sm overflow-hidden">' +
          '' +
          '<div class="relative grid md:grid-cols-[1fr_auto] gap-8 p-8 sm:p-12 items-center">' +
            '<div>' +
              '<div class="flex items-center gap-2 text-[#d4a02a] mb-5"><span class="w-1.5 h-1.5 bg-[#d4a02a] rounded-full animate-pulse-glow"></span>' +
                '<span class="font-mono-ibm text-[10px] tracking-[0.3em] uppercase">Documento DC</span></div>' +
              '<p class="text-[#c8d2dc] text-lg leading-relaxed font-light mb-6">El Departamento Científico es uno de los pilares fundamentales que forman parte de la fundación. Su objetivo principal se enfoca en el desarrollo de la información que se obtiene mediante el estudio de entidades anómalas; con la finalidad de expandir los conocimientos posibles para el desarrollo máximo de procedimientos especiales de contención.</p>' +
              '<p class="border-l-2 border-[#9a4a2a] pl-4 text-[#8a98a8] leading-relaxed">Fomentamos en nombre de la ciencia expandir los horizontes del departamento y ayudar a la fundación con las mejores investigaciones posibles, logrando los objetivos que se proponen.</p>' +
            '</div>' +
            '<div class="hidden md:flex justify-center"><div class="relative">' + atomMark('w-48 h-48') +
              '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    /* ───────────── Normas del Departamento ───────────── */
    function articleBlock(num, title, tag, body) {
      return '<div class="panel rounded-sm p-6 sm:p-8">' +
        '<div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#1a2532] pb-4 mb-6">' +
          '<div class="flex items-center gap-3">' +
            '<span class="font-mono-ibm text-xs px-2.5 py-1 bg-[#9a4a2a]/20 border border-[#9a4a2a]/40 text-[#d4a02a] font-semibold">ART. ' + num + '</span>' +
            '<h3 class="font-typewriter text-xl text-[#c8d2dc]">' + title + '</h3>' +
          '</div>' +
          '<span class="font-mono-ibm text-[10px] text-[#5a6878] tracking-[0.2em] uppercase">' + tag + '</span>' +
        '</div>' + body +
      '</div>';
    }

    function itemCard(iconName, title, desc) {
      return '<div class="border border-[#1a2532] bg-[#07090c] p-5 hover:border-[#d4a02a]/30 transition-all flex items-start gap-4">' +
        '<div class="w-10 h-10 border border-[#1a2532] flex items-center justify-center text-[#d4a02a] flex-shrink-0">' + icon(iconName, 18) + '</div>' +
        '<div>' +
          '<h4 class="font-typewriter text-base text-[#c8d2dc] mb-1.5">' + title + '</h4>' +
          '<p class="text-xs text-[#8a98a8] leading-relaxed">' + desc + '</p>' +
        '</div>' +
      '</div>';
    }

    function normas() {
      // ART. II — niveles de acceso (colores simplificados: neutro hasta NVL 2, ámbar desde NVL 3)
      var accessLevels = [
        { lvl: 'NVL 0', title: 'Personal en Entrenamiento', desc: 'Personal en fase de inducción y aprendizaje. Acceso restringido exclusivamente a áreas comunes y formativas.', tag: 'Formativo', high: false },
        { lvl: 'NVL 1', title: 'Investigación Básica', desc: 'Investigación preliminar y experimentación con anomalías catalogadas de Bajo Riesgo (SCPs Safe).', tag: 'Autorizado', high: false },
        { lvl: 'NVL 2', title: 'Investigación Intermedia', desc: 'Investigación intermedia sobre anomalías estándar y SCPs formalmente autorizados por supervisión.', tag: 'Autorizado', high: false },
        { lvl: 'NVL 3', title: 'Investigación Avanzada', desc: 'Proyectos especiales, anomalías Euclídeas de alta complejidad y procedimientos de riesgo controlado.', tag: 'Autorizado', high: true },
        { lvl: 'NVL 4', title: 'Dirección Científica', desc: 'Supervisión divisional, aprobación y revisión de proyectos mayores y administración operativa del sector.', tag: 'Alto Mando', high: true },
        { lvl: 'NVL 5', title: 'Dirección del Sitio / Superior', desc: 'Acceso total y crítico. Concedido únicamente bajo autorización explícita de la Dirección del Sitio o mando superior.', tag: 'Confidencial', high: true }
      ];

      var accessHtml = accessLevels.map(function (lvl) {
        return '<div class="border border-[#1a2532] bg-[#07090c] p-4 hover:bg-[#07090c] transition-all">' +
          '<div class="flex items-center justify-between mb-2.5">' +
            '<span class="font-mono-ibm text-xs px-2 py-0.5 font-semibold ' + (lvl.high ? 'bg-[#d4a02a]/10 text-[#d4a02a]' : 'bg-[#1a2532]/80 text-[#8a98a8]') + '">' + lvl.lvl + '</span>' +
            '<span class="font-mono-ibm text-[9px] uppercase tracking-[0.2em] text-[#5a6878]">' + lvl.tag + '</span>' +
          '</div>' +
          '<h4 class="font-typewriter text-sm text-[#c8d2dc] mb-1.5">' + lvl.title + '</h4>' +
          '<p class="text-xs text-[#8a98a8] leading-relaxed">' + lvl.desc + '</p>' +
        '</div>';
      }).join('');

      return '<div class="animate-fade-in space-y-8">' +
        sectionHeading('§ 02 — Documento SCD-002', 'Normas del Departamento', 'Código de conducta, seguridad perimetral y protocolos operativos') +

        '<div class="panel rounded-sm p-6 sm:p-7 border-l-4 border-l-[#d4a02a]">' +
          '<div class="flex items-center gap-2.5 text-[#d4a02a] mb-2">' +
            icon('scroll', 16) +
            '<span class="font-mono-ibm text-[11px] tracking-[0.25em] uppercase font-semibold">Código Normativo Departamental // DC-REGULACION-2026 </span>' +
          '</div>' +
          '<p class="text-sm text-[#8a98a8] leading-relaxed">Todo el personal de Departamento Científico debe acatar de forma estricta los siguientes artículos y directivas.</p>' +
        '</div>' +

        // ART. I
        articleBlock('I', 'Seguimiento del Código de Ética', 'Comité de Ética',
          '<p class="text-sm text-[#8a98a8] leading-relaxed">Todos los procedimientos del departamento se rigen por el Código de Ética y se ejecutan bajo las órdenes del Comité de Ética. Ningún rango está por encima de sus indicaciones.</p>'
        ) +

        // ART. II
        articleBlock('II', 'Clasificación de Acceso', 'Control Perimetral',
          '<p class="text-sm text-[#8a98a8] leading-relaxed mb-6">Los científicos sólo podrán acceder a las áreas, laboratorios y sectores expresamente permitidos por su <span class="text-[#d4a02a]">nivel de autorización acreditado</span>. Traspasar límites sin autorización constituye una falta grave.</p>' +
          '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3.5">' + accessHtml + '</div>'
        ) +

        // ART. III
        articleBlock('III', 'Normativa de Estancia', 'Vestimenta y Objetos',
          '<div class="grid sm:grid-cols-2 gap-4">' +
            itemCard('shieldCheck', 'Código de vestimenta', 'Uniforme del departamento dentro de las áreas de trabajo, con la acreditación siempre visible.') +
            itemCard('archive', 'Portación de objetos', 'Solo se porta el equipo asignado por el departamento. Ningún objeto que procede fuera del departamento debe ser equipado sin autorización.') +
          '</div>'
        ) +

        // ART. IV
        articleBlock('IV', 'Derechos de los Sujetos Clase-D', 'Comité de Ética',
          '<div class="grid md:grid-cols-3 gap-4">' +
            itemCard('clipboard', 'Máximo por prueba', 'No se pueden pedir más de 7 sujetos en una misma prueba. Se usarán cantidades razonables según lo que requiera cada una.') +
            itemCard('users', 'Respeto al personal Clase-D', 'El personal Clase-D debe ser tratado con respeto en todo momento. El personal Clase-D cuenta con derechos respaldados por el Comité de Ética y deberán ser tratados como personas.') +
            itemCard('shieldAlert', 'Daño mínimo', 'Las pruebas, aunque por su alto índice investigativo y gran aporte a la fundación, deben ser reguladas para prevenir el desperdicio de los sujetos.') +
          '</div>'
        ) +

        // ART. V
        articleBlock('V', 'Contención y Brechas', 'Seguridad',
          '<div class="grid sm:grid-cols-2 gap-4">' +
            itemCard('ban', 'Celdas de contención', 'Queda prohibido abrir cualquier celda de contención sin razón aparente. De todas formas, el combativo tendrá la expresa preferencia a realizar esto.') +
            itemCard('alert', 'Protocolo de brecha', 'Ante una brecha de contención, el experimento se suspende de inmediato y se evacúa sin demora hacia el refugio accesible más cercano.') +
          '</div>'
        ) +

        // ART. VI
        articleBlock('VI', 'Adjunto de Pruebas de Investigación', 'Registro',
          '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">' +
            '<p class="text-sm text-[#8a98a8] leading-relaxed">Las pruebas de investigación se adjuntan y consultan en su propia sección.</p>' +
            '<button data-nav="pruebas" class="flex items-center gap-2 self-start sm:self-auto px-4 py-2.5 border border-[#9a4a2a]/50 bg-[#9a4a2a]/20 text-[#d4a02a] font-mono-ibm text-[11px] tracking-[0.2em] uppercase hover:bg-[#9a4a2a]/30 hover:border-[#9a4a2a] transition-all whitespace-nowrap">Ir a Pruebas ' + icon('arrow', 14) + '</button>' +
          '</div>'
        ) +

        // ART. VII
        articleBlock('VII', 'Deberes del Ejecutivo', 'Mando',
          '<div class="grid md:grid-cols-3 gap-4">' +
            itemCard('book', 'Formar al personal', 'Enseñar y capacitar a los investigadores a su cargo.') +
            itemCard('users', 'Respeto mutuo', 'Mantener un trato de respeto mutuo con el personal.') +
            itemCard('eye', 'Atención', 'Atender las necesidades y dudas de los investigadores.') +
          '</div>'
        ) +

        '<div class="flex items-center gap-3 border border-[#9a4a2a]/30 bg-[#07090c] p-4">' +
          icon('shieldAlert', 18, 'text-[#9a4a2a] flex-shrink-0') +
          '<p class="text-xs text-[#c8d2dc] leading-relaxed">El desconocimiento de estas normas no exime de su cumplimiento, y cualquier infracción activará el protocolo sancionatorio correspondiente.</p>' +
        '</div>' +
      '</div>';
    }

          '</div>'
        ) +
      '</div>';
    }

    function administrativa() {
      var leadership = [
        { title: 'Supervisor del Consejo', code: 'CARGO-01', img: AVATAR },
        { title: 'Director del Departamento', code: 'CARGO-02' },
        { title: 'Vice-Director del Departamento', code: 'CARGO-03', img: AVATAR }
      ];

      var portraits = leadership.map(function (person) {
        return '<article class="panel rounded-sm overflow-hidden group">' +
          '<div class="aspect-[4/3] min-h-56 bg-[#080c10] border-b border-[#1a2532] overflow-hidden">' +
            (person.img ? '<img src="' + person.img + '" alt="' + person.title + '" class="w-full h-full object-cover object-top" />' : '') +
          '</div>' +
          '<div class="p-5 text-center">' +
            '<h3 class="font-typewriter text-base sm:text-lg text-[#c8d2dc]">' + person.title + '</h3>' +
          '</div>' +
        '</article>';
      }).join('');

      return '<div class="animate-fade-in">' +
        sectionHeading('§ 04 — Documento SCD-004', 'Sección Administrativa', 'Estructura operativa y registro de divisiones') +
        docBlock(
          '<div class="grid md:grid-cols-3 gap-5">' + portraits + '</div>' +
          '<div class="mt-8 grid lg:grid-cols-[1fr_minmax(0,19rem)] gap-8 items-start">' +
            '<div>' +
              '<h3 class="font-typewriter text-xl text-[#c8d2dc] mb-3">Qué hace la Administración</h3>' +
              '<p class="text-sm text-[#8a98a8] leading-relaxed"> La administración del departamento científico consiste en una organización de ciertos rangos del departamento con el poder de toma de decisiones.</p>' +
              '<p class="text-sm text-[#8a98a8] leading-relaxed"> Desde la administración se pueden hacer grandes cambios, desde la dirección de los experimentos, formación a los estudiantes, organización de grupo...</p>' +
            '</div>' +
            '<aside class="relative overflow-hidden border border-[#d4a02a]/30 bg-[#07090c] p-5">' +
              '' +
              '<div class="relative">' +
                '<div class="flex items-center gap-2 text-[#d4a02a]">' +
                  icon('radio', 14, 'animate-pulse') +
                  '<span class="font-mono-ibm text-[10px] tracking-[0.2em] uppercase">Nota de campo / 001</span>' +
                '</div>' +
                '<div class="my-4 text-[#d4a02a]/70">' + icon('infinity', 40) + '</div>' +
                '<p class="text-[#c8d2dc] text-sm leading-relaxed">Se han detectado variaciones en la densidad de las lecturas cuánticas durante el turno nocturno. Ordeno un respaldo completo de los servidores de telemetría y una inspección rigurosa de los blindajes de aislamiento. Cualquier descuido en estos protocolos comprometerá la estabilidad de todo el sector.</p>' +

        sectionHeading('§ 05 — Documento SCD-005', 'Jerarquía del Departamento', 'Rangos, escalas y acreditación científica') +
        docBlock(
          '<p class="mb-8">La jerarquía del Departamento Científico se organiza en rangos distribuidos entre bajo, medio y alto mando. Cada rango cuenta con una acreditación determinada según su posición.</p>' +
          '<div class="border border-[#1a2532] overflow-hidden">' +
            '<div class="hidden md:grid grid-cols-[1.5fr_1fr_0.8fr] bg-[#07090c] border-b border-[#1a2532] font-mono-ibm text-[10px] text-[#d4a02a] tracking-[0.2em] uppercase">' +
              '<div class="px-5 py-4">Rangos</div><div class="px-5 py-4">Escala</div><div class="px-5 py-4">Acreditación</div>' +
            '</div>' + rows +
          '</div>'
        ) +
      '</div>';
    }

    /* ───────────── Render principal ───────────── */
    var VIEWS = { overview: overview, introduccion: introduccion, normas: normas, pruebas: pruebas, administrativa: administrativa, jerarquia: jerarquia };

    function render() {
      if (!state.granted) {
        app.innerHTML = accessScreen();
        return;
      }
      app.innerHTML =
        '<div class="min-h-screen bg-[#07090c]">' +
          (state.view !== 'overview' ? header() : '') +
          '<main class="max-w-6xl mx-auto px-4 sm:px-6 py-12">' + VIEWS[state.view]() + '</main>' +
        '</div>';
    }

    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-action="access"]')) {
        if (!state.authenticating) startAuthentication();
        return;
      }
      var el = e.target.closest('[data-nav]');
      if (!el || !state.granted) return;
      var target = el.getAttribute('data-nav');
      if (!VIEWS[target]) return;
      state.view = target;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.addEventListener('submit', function (e) {
      if (e.target.id === 'access-form') {
        e.preventDefault();
        if (!state.authenticating) startAuthentication();
      }
    });

    render();
  })();
  </script>
</body>
</html>
